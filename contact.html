<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - NOTAM MAP View</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-variant: #2a2a2a;
            --primary-color: #d0bcff; 
            --primary-dark: #381e72;
            --text-main: #ffffff;
            --orange-accent: #ff9800;
        }
        
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: var(--primary-color); border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 30px;}
        a { color: var(--orange-accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { display: inline-block; margin-bottom: 20px; padding: 10px 15px; background: var(--surface-variant); border-radius: 8px; border: 1px solid #444; color: #fff; font-weight: bold; }
        
        .lang-en { display: none; }

        /* 🌟 フォーム用のスタイル */
        .contact-form {
            background-color: var(--surface-variant);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #444;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--surface-color);
            border: 1px solid #555;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        .submit-btn {
            background-color: var(--primary-color);
            color: var(--primary-dark);
            border: none;
            padding: 14px 24px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <a href="/" class="back-link">← Back to Map App</a>

    <!-- 🇯🇵 日本語コンテンツ -->
    <div class="lang-ja">
        <h1>お問い合わせ (Contact Us)</h1>
        <p>当アプリ（NOTAM MAP View）に関する不具合のご報告、機能に関するご要望、その他のお問い合わせは、以下のフォームよりお送りください。</p>
    </div>

    <!-- 🇺🇸 英語コンテンツ -->
    <div class="lang-en">
        <h1>Contact Us</h1>
        <p>If you have any bug reports, feature requests, or other inquiries regarding NOTAM MAP View, please contact us using the form below.</p>
    </div>

    <!-- 🌟 共通のお問い合わせフォーム -->
    <!-- actionのURLをFormspreeで取得したものに書き換えてください -->
    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
            <label id="label-name">お名前 / Name</label>
            <input type="text" name="name" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
            <label id="label-email">メールアドレス / Email</label>
            <input type="email" name="email" required placeholder="your@email.com">
        </div>
        
        <div class="form-group">
            <label id="label-message">お問い合わせ内容 / Message</label>
            <textarea name="message" required placeholder="ここにメッセージを入力してください / Enter your message here..."></textarea>
        </div>
        
        <button type="submit" class="submit-btn" id="btn-submit">送信する / Send Message</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isJa = (navigator.language || navigator.userLanguage).startsWith('ja');
            
            // 言語切替処理
            if (!isJa) {
                document.querySelector('.lang-ja').style.display = 'none';
                document.querySelector('.lang-en').style.display = 'block';
                
                document.getElementById('label-name').innerText = 'Name';
                document.getElementById('label-email').innerText = 'Email';
                document.getElementById('label-message').innerText = 'Message';
                document.getElementById('btn-submit').innerText = 'Send Message';
            } else {
                document.getElementById('label-name').innerText = 'お名前';
                document.getElementById('label-email').innerText = 'メールアドレス';
                document.getElementById('label-message').innerText = 'お問い合わせ内容';
                document.getElementById('btn-submit').innerText = '送信する';
            }
        });
    </script>
</body>
</html>
